# Include inside the HTTPS server block, not a location.
# Requires pocketimg-login-limit.conf in the http context.
limit_req zone=pocketimg_login_per_ip burst=5 nodelay;
limit_req_status 429;
limit_req_log_level warn;
add_header Retry-After $pocketimg_login_retry_after always;

# Upstream errors must retain their own response bodies and Retry-After values.
proxy_intercept_errors off;
error_page 429 = @pocketimg_login_throttled;
location @pocketimg_login_throttled {
    default_type application/json;
    return 429 '{"error":"Too many login attempts from this IP; retry later."}';
}
