# Install in /etc/nginx/conf.d/ (http context).
# This deployment is DNS-only: use the TCP peer, never caller-supplied IP headers.
# Empty keys skip accounting, so logout, uploads, gallery and public images are
# not charged against the login budget.
map "$request_method:$uri" $pocketimg_login_ip {
    default "";
    "POST:/api/auth/session" $binary_remote_addr;
}

limit_req_zone $pocketimg_login_ip zone=pocketimg_login_per_ip:10m rate=10r/m;

map $limit_req_status $pocketimg_login_retry_after {
    default "";
    REJECTED "6";
}
