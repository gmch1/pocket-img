name: Release all PocketIMG components

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version shared by all components, for example 0.4.41"
        required: true
        type: string

permissions:
  contents: write

jobs:
  server:
    uses: ./.github/workflows/release-server.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit

  android:
    uses: ./.github/workflows/release-android.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit

  macos:
    uses: ./.github/workflows/release-macos.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit
