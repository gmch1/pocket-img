name: Smoke Test macOS Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to test, for example v0.4.17"
        required: true
        type: string

permissions:
  contents: read

jobs:
  launch:
    runs-on: macos-15
    steps:
      - name: Download release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like v0.4.17" >&2
            exit 1
          fi
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern 'PocketIMGShot-*-macos-universal.zip*' \
            --dir "${RUNNER_TEMP}/release"

      - name: Verify and launch release app
        shell: bash
        run: |
          archive="$(find "${RUNNER_TEMP}/release" -type f -name 'PocketIMGShot-*-macos-universal.zip' -print -quit)"
          checksum="${archive}.sha256"
          test -f "${archive}"
          test -f "${checksum}"
          (
            cd "$(dirname "${archive}")"
            shasum -a 256 -c "$(basename "${checksum}")"
          )
          ditto -x -k "${archive}" "${RUNNER_TEMP}/unpacked"
          app="${RUNNER_TEMP}/unpacked/PocketIMGShot.app"
          binary="${app}/Contents/MacOS/PocketIMGShot"
          codesign --verify --deep --strict "${app}"

          launch_log="${RUNNER_TEMP}/PocketIMGShot-launch.log"
          "${binary}" > "${launch_log}" 2>&1 &
          app_pid=$!
          for attempt in $(seq 1 20); do
            if ! kill -0 "${app_pid}" 2>/dev/null; then
              wait "${app_pid}" || true
              cat "${launch_log}" >&2
              exit 1
            fi
            sleep 0.25
          done
          kill -TERM "${app_pid}"
          set +e
          wait "${app_pid}"
          exit_code=$?
          set -e
          if [[ "${exit_code}" -ne 0 && "${exit_code}" -ne 143 ]]; then
            cat "${launch_log}" >&2
            exit "${exit_code}"
          fi
